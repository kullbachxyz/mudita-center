<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mudita Center</title>
    <style>
      html {
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #000000;
      }
      img {
        width: 100%;
        height: 100%;
        /* MMD monochrome: invert flips the neutral SVG to match the dark app;
           grayscale guards against tint turning brown; brightness lifts the
           mid-grey artwork so it reads lighter. */
        filter: invert(1) grayscale(1) brightness(1.5);
      }
    </style>
  </head>
  <body>
    <img src="splash.svg" />
  </body>
</html>
